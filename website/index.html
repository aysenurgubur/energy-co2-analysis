<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Energy CO₂ Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Energy CO₂ Calculator</h1>

        <p class="subtitle">
            Estimate the CO₂ emissions associated with your energy consumption.
        </p>

        <div class="calculator">

            <label for="energySource">
                Energy source
            </label>

            <select id="energySource">
                <option value="coal">Coal</option>
                <option value="naturalGas">Natural Gas</option>
            </select>

            <label for="amount">
                Amount consumed
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="0"
                step="any"
            >

            <p>
                Unit: <strong id="unit">kg</strong>
            </p>

            <div class="result">

                <h2>Estimated CO₂ emissions</h2>

                <p id="result">
                    Enter a value above.
                </p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
