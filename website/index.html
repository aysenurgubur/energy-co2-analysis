<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Energy CO₂ Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Energy CO₂ Calculator</h1>

    <p>Estimate your CO₂ emissions from energy consumption.</p>

    <label for="energySource">Energy source:</label>

    <select id="energySource">
        <option value="coal">Coal</option>
        <option value="naturalGas">Natural Gas</option>
    </select>

    <br><br>

    <label for="amount">Amount:</label>

    <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="0"
        step="any"
    >

    <span id="unit">kg</span>

    <h2>Estimated CO₂ emissions</h2>

    <p id="result">Enter a value above.</p>

    <script src="script.js"></script>

</body>

</html>
